/* ========================================================
   Geo Team Design Language Tokens (Night & Day)
   ======================================================== */
:root[data-theme="dark"], :root:not([data-theme="light"]) {
  color-scheme: dark;
  --bg: #0d0c0a;
  --hero: #0d0c0a;
  --sheet: #161512;
  --card: #1f1d19;
  --card-2: #282520;
  --line: #2e2b25;
  --text: #f4efe4;
  --muted: #a9a193;
  --dim: #958e80;
  --gold: #e9c466;
  --gold-ink: #241c06;
  --gold-text: #e9c466;
  --gold-soft: rgb(233 196 102 / 0.12);
  --gold-edge: #e9c466;
  --strip: #1f1d19;
  --strip-text: #a9a193;
  --ok: #4fc58a;
  --ok-soft: rgb(79 197 138 / 0.14);
  --warn: #f2a03d;
  --warn-soft: rgb(242 160 61 / 0.14);
  --off: #9a9385;
  --off-soft: rgb(255 255 255 / 0.06);
  --nav: #161512;
  --danger: #f07a6a;
  --danger-soft: rgb(240 122 106 / 0.12);

  /* Compatibility & Semantic Aliases */
  --sec: var(--card-2);
  --card-subtle: var(--sheet);
  --fg: var(--text);
  --mut: var(--muted);
  --bd: var(--line);
  --bd-focus: var(--gold);
  --ac: var(--gold);
  --ac-hover: #f3d484;
  --ac-subtle: var(--gold-soft);
  --ac-border: var(--gold-edge);
  --acf: var(--gold-ink);
  --wr: var(--danger);
  --wr-subtle: var(--danger-soft);
  --wr-border: rgb(240 122 106 / 0.3);
  --ok-border: rgb(79 197 138 / 0.3);
  --yl: var(--warn);
  --yl-subtle: var(--warn-soft);

  --r-btn: 999px;
  --r-card: 20px;
  --r-card-sub: 14px;
  --r-sheet: 26px;
  --r-pill: 9999px;

  --shadow-card: 0 4px 18px rgba(0,0,0,0.35);
  --shadow-sheet: 0 -8px 36px rgba(0,0,0,0.65);
  --shadow-toast: 0 10px 30px rgba(0,0,0,0.55);
  --tabbar-bg: #161512;
  --tab-indicator-bg: var(--gold-soft);
  --tab-indicator-border: var(--gold-edge);
  --header-bg: var(--hero);
  --tab-h: 62px;
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f1ea;
  --hero: #17150f;
  --sheet: #f4f1ea;
  --card: #ffffff;
  --card-2: #f7f3ea;
  --line: #e8e2d4;
  --text: #1b1912;
  --muted: #6a6355;
  --dim: #6f6859;
  --gold: #dcb553;
  --gold-ink: #231a04;
  --gold-text: #836410;
  --gold-soft: rgb(220 181 83 / 0.18);
  --gold-edge: #836410;
  --strip: #17150f;
  --strip-text: #bdb5a5;
  --ok: #0f7a47;
  --ok-soft: rgb(15 122 71 / 0.10);
  --warn: #9a5200;
  --warn-soft: rgb(154 82 0 / 0.10);
  --off: #6f6859;
  --off-soft: rgb(0 0 0 / 0.05);
  --nav: #ffffff;
  --danger: #b3261e;
  --danger-soft: rgb(179 38 30 / 0.08);

  /* Compatibility & Semantic Aliases */
  --sec: var(--card-2);
  --card-subtle: #fbf9f5;
  --fg: var(--text);
  --mut: var(--muted);
  --bd: var(--line);
  --bd-focus: var(--gold-edge);
  --ac: var(--gold);
  --ac-hover: #cfa33f;
  --ac-subtle: var(--gold-soft);
  --ac-border: var(--gold-edge);
  --acf: var(--gold-ink);
  --wr: var(--danger);
  --wr-subtle: var(--danger-soft);
  --wr-border: rgb(179 38 30 / 0.25);
  --ok-border: rgb(15 122 71 / 0.25);
  --yl: var(--warn);
  --yl-subtle: var(--warn-soft);

  --r-btn: 999px;
  --r-card: 20px;
  --r-card-sub: 14px;
  --r-sheet: 26px;
  --r-pill: 9999px;

  --shadow-card: 0 2px 10px rgba(0,0,0,0.04);
  --shadow-sheet: 0 -8px 32px rgba(0,0,0,0.12);
  --shadow-toast: 0 8px 24px rgba(0,0,0,0.14);
  --tabbar-bg: #ffffff;
  --tab-indicator-bg: var(--gold-soft);
  --tab-indicator-border: var(--gold-edge);
  --header-bg: var(--bg);
  --tab-h: 62px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    color-scheme: dark;
    --bg: #0d0c0a;
    --hero: #0d0c0a;
    --sheet: #161512;
    --card: #1f1d19;
    --card-2: #282520;
    --line: #2e2b25;
    --text: #f4efe4;
    --muted: #a9a193;
    --dim: #958e80;
    --gold: #e9c466;
    --gold-ink: #241c06;
    --gold-text: #e9c466;
    --gold-soft: rgb(233 196 102 / 0.12);
    --gold-edge: #e9c466;
    --ok: #4fc58a;
    --ok-soft: rgb(79 197 138 / 0.14);
    --warn: #f2a03d;
    --warn-soft: rgb(242 160 61 / 0.14);
    --off: #9a9385;
    --off-soft: rgb(255 255 255 / 0.06);
    --nav: #161512;
    --danger: #f07a6a;
    --danger-soft: rgb(240 122 106 / 0.12);
  }
}

/* ========================================================
   Base Reset & Persian RTL Typography
   ======================================================== */
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Yekan Bakh", Tahoma, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  font-size: 14.5px;
  line-height: 1.65;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

main {
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 0 14px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom, 0px));
}

/* Latin commands & hostnames: system mono */
.tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.ltr { direction: ltr; text-align: start; unicode-bidi: isolate; overflow-wrap: anywhere; }
.mono, .ltr.mono, code, pre, kbd {
  font-family: ui-monospace, Menlo, Consolas, monospace;
  direction: ltr;
  unicode-bidi: isolate;
  text-align: start;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.mut { color: var(--muted); font-size: 12px; }

/* Lucide-style Line Icons */
.icon { width: 18px; height: 18px; stroke-width: 1.75; stroke: currentColor; fill: none; flex-shrink: 0; vertical-align: middle; stroke-linecap: round; stroke-linejoin: round; }
.icon-sm { width: 16px; height: 16px; stroke-width: 1.75; stroke: currentColor; fill: none; flex-shrink: 0; stroke-linecap: round; stroke-linejoin: round; }
.icon-xs { width: 13px; height: 13px; stroke-width: 1.75; stroke: currentColor; fill: none; flex-shrink: 0; stroke-linecap: round; stroke-linejoin: round; }

/* Geo Header Style */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--header-bg);
  padding: 14px 0 10px;
  margin-bottom: 14px;
  border-bottom: 1px solid transparent;
  transition: padding 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
}
header.scrolled {
  padding-block: 8px;
  border-bottom-color: var(--line);
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.header-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
h1 {
  font-size: 21px;
  font-weight: 800;
  line-height: 1.3;
  margin: 0;
  color: var(--text);
  letter-spacing: -0.01em;
  white-space: nowrap;
}
header.scrolled h1 { font-size: 17px; }

/* Health Pill */
.health-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--r-pill);
  background: var(--card-2);
  color: var(--muted);
  border: 1px solid var(--line);
  white-space: nowrap;
  transition: all 150ms ease;
}
.health-pill.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
.health-pill.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.health-pill.bad { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }

.status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.dot-green { background: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
.dot-yellow { background: var(--warn); box-shadow: 0 0 0 2px var(--warn-soft); }
.dot-red { background: var(--danger); box-shadow: 0 0 0 2px var(--danger-soft); }
.dot-gray { background: var(--dim); }

/* Round Refresh Button (min 44px tap target) */
.btn-refresh {
  width: 44px;
  height: 44px;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  padding: 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--line);
  cursor: pointer;
  touch-action: manipulation;
  transition: transform 120ms ease-out, background-color 150ms ease, border-color 150ms ease;
  flex-shrink: 0;
}
.btn-refresh:active { transform: scale(0.92); }
.btn-refresh:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn-refresh.spinning svg { animation: spin 0.8s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.age {
  color: var(--muted);
  font-size: 11.5px;
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.age.old { color: var(--danger); font-weight: 700; }

/* Geo Card Style */
.card {
  background: var(--card);
  border-radius: var(--r-card);
  padding: 16px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-card);
  animation: cardFadeRise 240ms cubic-bezier(0.16,1,0.3,1) both;
}
.tab-pane > .card:nth-child(1) { animation-delay: 0ms; }
.tab-pane > .card:nth-child(2) { animation-delay: 40ms; }
.tab-pane > .card:nth-child(3) { animation-delay: 80ms; }
.tab-pane > .card:nth-child(4) { animation-delay: 120ms; }

@keyframes cardFadeRise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-label {
  font-size: 12.5px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: 0.02em;
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label .icon-sm { color: var(--gold-text); }

/* ========================================================
   CIRCULAR DISPLAYS & RING GAUGES
   ======================================================== */
@keyframes ringFill {
  from { stroke-dashoffset: var(--ring-circumference, 200px); }
  to { stroke-dashoffset: var(--ring-offset, 0px); }
}
.ring-anim {
  animation: ringFill 750ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.ring-gauge {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  text-align: center;
}
.ring-circle {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.ring-circle svg { display: block; }
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  line-height: 1.1;
}
.ring-val {
  font-weight: 800;
  color: var(--text);
  font-size: 11px;
}
.ring-lg .ring-val {
  font-size: 15px;
  font-weight: 800;
}
.ring-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
}
.ring-lg .ring-label {
  font-size: 12px;
  font-weight: 800;
  color: var(--text);
  margin-top: 4px;
}

/* Donut Gauge for System Health */
.donut-gauge {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.donut-gauge svg { display: block; }
.donut-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  line-height: 1.1;
}
.donut-val {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}
.donut-sub {
  font-size: 11px;
  color: var(--muted);
  font-weight: 700;
  margin-top: 2px;
}

/* Health Donut Overview Card */
.overview-hero-card {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 12px;
}
.overview-donut-box { flex-shrink: 0; }
.overview-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.overview-title { font-size: 14px; font-weight: 800; color: var(--text); }
.overview-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11.5px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: var(--r-pill);
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--muted);
  align-self: flex-start;
}
.overview-status-pill.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-border); }
.overview-status-pill.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.overview-status-pill.bad { background: var(--danger-soft); color: var(--danger); border-color: var(--danger); }
.overview-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  margin-top: 2px;
  font-size: 11px;
  color: var(--muted);
}
.leg-item { display: inline-flex; align-items: center; gap: 4px; }
.leg-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* Compact Stat Tiles */
.stats-strip { display: flex; flex-direction: column; gap: 10px; }
.stats-grid-tiles {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.stat-card {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: var(--r-card-sub);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 86px;
  transition: border-color 150ms ease, background-color 150ms ease;
}
.stat-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.ico-stat {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--gold-soft);
  color: var(--gold-text);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.stat-ring-wrap { flex-shrink: 0; }
.stat-val {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 2px;
}
@media (min-width: 380px) { .stat-val { font-size: 23px; } }
.stat-lab { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.stat-card.stat-ok { border-color: var(--ok-border); }
.stat-card.stat-ok .stat-val { color: var(--ok); }
.stat-card.stat-danger { border-color: var(--danger); background: var(--danger-soft); }
.stat-card.stat-danger .stat-val { color: var(--danger); }
.stat-card.stat-accent { border-color: var(--gold-edge); }
.stat-card.stat-accent .stat-val { color: var(--gold-text); }

/* Compact Server Rings Block on Main Dashboard */
.overview-servers-block {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.overview-block-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 8px;
}
.overview-servers-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.overview-srv-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
}
.overview-srv-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.srv-mini-host { font-size: 13px; font-weight: 700; color: var(--text); }
.overview-srv-rings { display: flex; align-items: center; gap: 14px; }

/* Quick Actions Tiles */
.tiles-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: right;
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  cursor: pointer;
  min-height: 82px;
  color: var(--text);
  touch-action: manipulation;
  transition: transform 120ms ease-out, border-color 150ms ease, background-color 150ms ease;
}
.tile:active { transform: scale(0.97); }
.tile:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.tile-hero {
  grid-column: 1 / -1;
  min-height: 94px;
  background: linear-gradient(135deg, rgba(175, 144, 48, 0.22) 0%, var(--gold-soft) 100%);
  border: 1.5px solid var(--gold-edge);
}
.tile-hero .tile-title { color: var(--gold-text); font-size: 15px; font-weight: 800; }
.tile-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.tile-ic-wrap {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  background: var(--card);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  border: 1px solid var(--line);
}
.tile-hero .tile-ic-wrap {
  background: var(--gold);
  color: var(--gold-ink);
  border-color: transparent;
}
.tile-tag {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  background: var(--gold);
  color: var(--gold-ink);
}
.tile-subtag {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--gold-soft);
  color: var(--gold-text);
  border: 1px solid var(--gold-edge);
}
.tile-title { font-size: 13.5px; font-weight: 800; margin-bottom: 2px; }
.tile-desc { font-size: 12px; color: var(--muted); line-height: 1.45; }
.tile-warn .tile-ic-wrap { color: var(--danger); background: var(--danger-soft); }

/* Buttons & Inputs (min 44px) */
button, select {
  min-height: 44px;
  font: inherit;
  font-size: 14px;
  border-radius: var(--r-btn);
  padding: 8px 14px;
  touch-action: manipulation;
}
button {
  border: 1px solid transparent;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 700;
  transition: transform 120ms ease-out, background-color 150ms ease, border-color 150ms ease, opacity 120ms ease;
}
button:active { transform: scale(0.97); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn-primary, button:not(.sec):not(.del):not(.btn-tonal):not(.btn-danger-tonal):not(.tab-btn):not(.btn-refresh):not(.tile):not(.opt) {
  background: linear-gradient(135deg, #af9030 0%, var(--gold) 100%);
  color: var(--gold-ink);
  font-weight: 800;
}
.btn-tonal, button.sec {
  background: var(--card-2);
  color: var(--text);
  border: 1px solid var(--line);
}
.btn-danger-tonal, button.del {
  background: var(--danger-soft);
  color: var(--danger);
  border: 1px solid rgb(240 122 106 / 0.3);
}
button:disabled { opacity: 0.55; background: var(--line); color: var(--dim); transform: none; cursor: not-allowed; }
select {
  padding-inline: 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card-2);
  color: inherit;
  flex: 1 1 100px;
  min-width: 0;
}
select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.acts button { flex: 1 1 auto; min-width: 80px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 10px; }
.grid.g3 { grid-template-columns: repeat(3, 1fr); }
.grid:last-child { margin-bottom: 0; }
.lab { font-size: 12px; font-weight: 800; color: var(--muted); margin: 14px 0 6px; }
.lab:first-of-type { margin-top: 0; }
.fm { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.st { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

.chip {
  font-size: 11.5px;
  line-height: 1.5;
  padding: 3px 9px;
  border-radius: var(--r-pill);
  background: var(--card-2);
  color: var(--muted);
  white-space: nowrap;
  border: 1px solid var(--line);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-weight: 700;
}
.chip.bad { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
.chip.ok { color: var(--ok); border-color: var(--ok-border); background: var(--ok-soft); }

/* Server Cards on Servers Tab (Large Rings) */
.server-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-inline-start-width: 4px;
  border-radius: var(--r-card);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-card);
}
.server-card.srv-ok { border-inline-start-color: var(--ok); }
.server-card.srv-warning { border-inline-start-color: var(--warn); }
.server-card.srv-danger { border-inline-start-color: var(--danger); }
.srv-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.srv-title-wrap { display: flex; align-items: center; gap: 8px; }
.srv-host { font-size: 15px; font-weight: 700; color: var(--text); }
.srv-badges { display: flex; align-items: center; gap: 6px; }

/* Large Rings Row */
.srv-rings-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 14px;
}
.srv-ring-card {
  background: var(--card-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.srv-ring-meta { display: flex; flex-direction: column; gap: 2px; }
.srv-ring-title { font-size: 12px; font-weight: 800; color: var(--text); }
.srv-ring-sub { font-size: 11px; }

.srv-danger-strip {
  background: var(--danger-soft);
  border: 1px solid var(--danger);
  color: var(--danger);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 12px;
}
.srv-footer { font-size: 12px; display: flex; align-items: center; gap: 6px; }

/* AI Session Cards */
.session-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-card);
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.session-card.active-session {
  border-color: var(--gold-edge);
  box-shadow: 0 0 0 1px var(--gold-edge), var(--shadow-card);
}
.sess-top-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.engine-monogram {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-weight: 800;
  font-size: 17px;
  flex-shrink: 0;
}
.engine-monogram.mono-claude { background: var(--gold-soft); color: var(--gold-text); border: 1px solid var(--gold-edge); }
.engine-monogram.mono-gemini { background: #172554; color: #60a5fa; border: 1px solid #1e3a8a; }
:root[data-theme="light"] .engine-monogram.mono-gemini { background: #eff6ff; color: #2563eb; border-color: #bfdbfe; }
.sess-info { flex: 1; min-width: 0; }
.sess-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sess-name { font-size: 15px; font-weight: 700; }
.active-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  background: var(--gold-soft);
  color: var(--gold-text);
  border: 1px solid var(--gold-edge);
}
.pulsing-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: pulseDot 1.4s ease-in-out infinite; }
@keyframes pulseDot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
.sess-meta { font-size: 12px; margin-top: 2px; }
.sess-acts { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; }

.row { padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; padding-top: 0; }
.name { font-weight: 700; font-size: 14px; }

/* Toast / Result Notification (#res) */
#res {
  position: fixed;
  bottom: calc(var(--tab-h) + 20px + env(safe-area-inset-bottom, 0px));
  inset-inline: 16px;
  max-width: 410px;
  margin: 0 auto;
  z-index: 105;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 16px;
  box-shadow: var(--shadow-toast);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 13.5px;
  line-height: 1.5;
  cursor: pointer;
  animation: toastIn 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
#res.bad { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
#res[hidden] { display: none !important; }
.toast-body { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.toast-close { color: var(--muted); opacity: 0.7; flex-shrink: 0; display: flex; align-items: center; }
@keyframes toastIn { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

/* Bottom Sheet Modal Dialog (Max 1 glass blur) */
.ov {
  position: fixed;
  inset: 0;
  background: rgba(13, 12, 10, 0.65);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  animation: fadeIn 200ms ease forwards;
}
.ov.ov-closing { animation: fadeOut 180ms ease forwards; }
.dl.sheet {
  background: var(--sheet);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  border: 1px solid var(--line);
  border-bottom: none;
  padding: 14px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  width: 100%;
  max-width: 440px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-sheet);
  animation: sheetSlideUp 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.dl.sheet.sheet-closing { animation: sheetSlideDown 180ms ease forwards; }
.sheet-handle { width: 38px; height: 4px; background: var(--dim); border-radius: 2px; margin: 0 auto 16px; }
.dm { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 14px; font-size: 14.5px; }
.dl input {
  width: 100%;
  min-height: 48px;
  margin: 6px 0 12px;
  padding: 10px 14px;
  font-size: 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card-2);
  color: inherit;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  direction: ltr;
  text-align: left;
}
.dl input:focus { border-color: var(--gold); outline: none; }
.dl .acts { display: flex; gap: 10px; margin-top: 14px; }
.dl .acts button { flex: 1; }
.dl .opt { width: 100%; margin-bottom: 8px; text-align: right; justify-content: flex-start; }

@keyframes sheetSlideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes sheetSlideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

/* Floating Bottom Tab Bar (Geo Dock Style with Active Dot) */
.tab-bar {
  position: fixed;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  inset-inline: 16px;
  max-width: 410px;
  margin: 0 auto;
  height: var(--tab-h);
  background: var(--nav);
  border-radius: 24px;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px;
  z-index: 99;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
.tab-indicator {
  position: absolute;
  left: 0;
  top: 4px;
  bottom: 4px;
  border-radius: 18px;
  background: var(--tab-indicator-bg);
  border: 1px solid var(--tab-indicator-border);
  transition: transform 220ms cubic-bezier(0.2, 0, 0, 1), width 220ms ease;
  pointer-events: none;
  z-index: 0;
}
.tab-btn {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: transparent;
  border: none;
  color: var(--dim);
  font-size: 11px;
  font-weight: 600;
  padding: 4px 0;
  min-height: 44px;
  cursor: pointer;
  touch-action: manipulation;
  transition: color 150ms ease;
}
.tab-btn:active { transform: scale(0.93); }
.tab-btn.active { color: var(--gold-text); font-weight: 800; }
.tab-btn .tab-ic { width: 20px; height: 20px; stroke-width: 1.75; stroke: currentColor; fill: none; transition: fill 150ms ease; stroke-linecap: round; stroke-linejoin: round; }
.tab-btn.active .tab-ic { fill: currentColor; }
.tab-btn.active::after {
  content: "";
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--gold-edge);
  margin-top: 1px;
}

/* Tab Panes */
.tab-pane { display: none; }
.tab-pane.active { display: block; animation: tabCrossfade 180ms ease forwards; }
@keyframes tabCrossfade { from { opacity: 0; } to { opacity: 1; } }

/* Skeleton Shimmer Loading Blocks */
.skeleton-card { position: relative; overflow: hidden; opacity: 0.8; }
.skeleton-line { background: var(--card-2); border-radius: 6px; position: relative; overflow: hidden; }
.skeleton-circle { background: var(--card-2); border-radius: 50%; position: relative; overflow: hidden; }
.skeleton-line::after, .skeleton-circle::after {
  content: "";
  position: absolute;
  inset: 0;
  transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(233, 196, 102, 0.12), transparent);
  animation: shimmer 1.5s infinite;
}
@keyframes shimmer { 100% { transform: translateX(100%); } }

/* Empty States */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 28px 16px;
  color: var(--muted);
  text-align: center;
}
.empty-state .icon { width: 34px; height: 34px; opacity: 0.45; }

<script>
var data=null,toastTimer=null;
function $(i){return document.getElementById(i)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=String(txt);return e}
function svgIcon(id,cls){return '<svg class="icon '+(cls||'')+'" aria-hidden="true"><use href="#'+id+'"></use></svg>'}
function fa(n){return String(n).replace(/\d/g,function(d){return"۰۱۲۳۴۵۶۷۸۹"[d]})}
function unb64url(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
  var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return JSON.parse(new TextDecoder("utf-8").decode(u));
}
var OKP=/^[A-Za-z0-9_-]{1,64}$/;

/* Circular SVG Ring Builder Helper */
function svgRing(pct, opt){
  opt = opt || {};
  var size = opt.size || 48;
  var sw = opt.sw || (size >= 64 ? 6 : 4);
  var r = (size - sw) / 2;
  var c = 2 * Math.PI * r;
  var val = Math.min(100, Math.max(0, Number(pct) || 0));
  var offset = c * (1 - val / 100);
  var tone = opt.tone || "ok";
  var strokeColor = opt.stroke || (tone === "danger" ? "var(--danger)" : tone === "warn" ? "var(--warn)" : tone === "gold" ? "var(--gold)" : "var(--ok)");
  var trackColor = opt.track || "var(--line)";
  var valTxt = opt.valTxt != null ? opt.valTxt : (fa(Math.round(val)) + "٪");
  var label = opt.label ? '<span class="ring-label">'+opt.label+'</span>' : '';
  var sub = opt.sub ? '<span class="ring-sub">'+opt.sub+'</span>' : '';

  return '<div class="ring-gauge ring-'+(size >= 64 ? 'lg' : 'sm')+'" style="width:'+size+'px" role="progressbar" aria-valuenow="'+val+'" aria-valuemin="0" aria-valuemax="100">'
    + '<div class="ring-circle" style="width:'+size+'px;height:'+size+'px;">'
    + '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+trackColor+'" stroke-width="'+sw+'" />'
    + '<circle class="ring-anim" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="'+strokeColor+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+offset.toFixed(2)+'" transform="rotate(-90 '+(size/2)+' '+(size/2)+')" style="--ring-circumference:'+c.toFixed(2)+'px;--ring-offset:'+offset.toFixed(2)+'px;" />'
    + '</svg>'
    + '<div class="ring-center">'
    + '<span class="ring-val tnum mono">'+valTxt+'</span>'
    + sub
    + '</div>'
    + '</div>'
    + label
    + '</div>';
}

/* Overall Health Donut Gauge Builder */
function svgDonut(up, warn, down, opt){
  opt = opt || {};
  var size = opt.size || 88;
  var sw = opt.sw || 8;
  var r = (size - sw) / 2;
  var c = 2 * Math.PI * r;
  var total = up + warn + down;
  var cx = size / 2, cy = size / 2;

  var circles = '';
  if(total <= 0){
    circles = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'" />';
  } else {
    circles += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="'+sw+'" opacity="0.35" />';
    var curOffset = 0;
    var segs = [
      { count: up, color: "var(--ok)", cls: "seg-up" },
      { count: warn, color: "var(--warn)", cls: "seg-warn" },
      { count: down, color: "var(--danger)", cls: "seg-down" }
    ];

    segs.forEach(function(s){
      if(s.count <= 0) return;
      var len = (s.count / total) * c;
      circles += '<circle class="ring-anim '+s.cls+'" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'" stroke-linecap="butt" stroke-dasharray="'+len.toFixed(2)+' '+(c - len).toFixed(2)+'" stroke-dashoffset="'+(-curOffset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')" style="--ring-circumference:'+c.toFixed(2)+'px;--ring-offset:'+(-curOffset).toFixed(2)+'px;" />';
      curOffset += len;
    });
  }

  var centerText = opt.centerText != null ? opt.centerText : fa(total);
  var centerSub = opt.centerSub != null ? opt.centerSub : "سرور";

  return '<div class="donut-gauge" style="width:'+size+'px;height:'+size+'px;">'
    + '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
    + circles
    + '</svg>'
    + '<div class="donut-center">'
    + '<span class="donut-val tnum">'+centerText+'</span>'
    + '<span class="donut-sub">'+centerSub+'</span>'
    + '</div>'
    + '</div>';
}

function theme(){
  var scheme = "dark";
  try{
    if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme){
      scheme = window.Telegram.WebApp.colorScheme;
    } else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches){
      scheme = "light";
    }
  }catch(e){}
  document.documentElement.setAttribute("data-theme", scheme);

  try{
    var m=/[#&]tgWebAppThemeParams=([^&]+)/.exec(location.hash);if(!m)return;
    var t=JSON.parse(decodeURIComponent(m[1]));
    for(var k in t)if(/^[a-z_]+$/.test(k)&&/^#[0-9a-fA-F]{3,8}$/.test(t[k]))document.documentElement.style.setProperty("--tg-theme-"+k.replace(/_/g,"-"),t[k]);
  }catch(e){}
}
if(window.matchMedia){
  try {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if(!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.colorScheme)) theme();
    });
  }catch(e){}
}
if(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.onEvent){

      // Large Circular Gauges row for Disk and RAM
      var diskVal=Math.min(100,Math.max(0,Number(s.disk)||0));
      var diskTone=diskVal>=90?"danger":diskVal>=75?"warn":"gold";
      var memVal=Math.min(100,Math.max(0,Number(s.mem)||0));
      var memTone=memVal<=10?"danger":memVal<=25?"warn":"ok";

      var ringsRow=el("div","srv-rings-row");
      ringsRow.innerHTML='<div class="srv-ring-card">'
        +svgRing(diskVal,{size:72,sw:6,tone:diskTone,label:"مصرف دیسک",valTxt:fa(diskVal)+"٪"})
        +'<div class="srv-ring-meta"><span class="srv-ring-title">فضای دیسک</span><span class="srv-ring-sub mut">'+(diskVal>=90?'بسیار پر':diskVal>=75?'رو به اتمام':'عادی')+'</span></div>'
        +'</div>'
        +'<div class="srv-ring-card">'
        +svgRing(memVal,{size:72,sw:6,tone:memTone,label:"رم آزاد",valTxt:fa(memVal)+"٪"})
        +'<div class="srv-ring-meta"><span class="srv-ring-title">حافظه رم</span><span class="srv-ring-sub mut">'+(memVal<=10?'بحرانی':memVal<=25?'هشدار':'مطلوب')+'</span></div>'
        +'</div>';
      card.appendChild(ringsRow);

      if(Array.isArray(s.down)&&s.down.length){
        var strip=el("div","srv-danger-strip mono ltr");
        strip.innerHTML=svgIcon("i-alert-triangle","icon-sm")+'<span>سرویس‌های قطع: '+s.down.join(" ")+'</span>';
        card.appendChild(strip);
      }

      var foot=el("div","srv-footer mut");
      foot.innerHTML=svgIcon("i-clock","icon-xs")+'<span>گزارش: '+ago(s.ts)+'</span>';
      card.appendChild(foot);
      sv.appendChild(card);
    });
  }

  // TAB 3 Vault & Sudo
  var st=$("secst");
  if(st){
    var vOpen2=Array.isArray(v)&&v[0]==="u";
    var vTxt=!Array.isArray(v)?"صندوق: نامشخص":vOpen2?"صندوق باز، "+fa(Math.max(0,Math.floor(v[1]-now/60)))+" دقیقه مانده":v[0]==="n"?"صندوق ساخته نشده":"صندوق بسته";
    chip(st,vTxt,vOpen2?"ok":"",vOpen2?"i-unlock":"i-lock");

    var suOn2=Array.isArray(su)&&su.length;
    var suTxt=!Array.isArray(su)?"sudo: نامشخص":suOn2?"sudo روشن: "+su.map(function(x){return x.s+" تا "+fa(Math.max(0,Math.floor((x.e-now)/60)))+" دقیقه"}).join("، "):"sudo خاموش";
    chip(st,suTxt,suOn2?"ok":"",suOn2?"i-key":"i-lock");
  }

  var sb=$("secbtn"),g;
  if(sb){
    sb.appendChild(el("div","lab","صندوق رمز"));
    g=el("div","grid g3");
    var b1=btn("۱۵ دقیقه","vu_15",g,"btn-tonal");b1.innerHTML=svgIcon("i-unlock","icon-sm")+'<span>'+fa(15)+' دقیقه</span>';
    var b2=btn("۳۰ دقیقه","vu_30",g,"btn-tonal");b2.innerHTML=svgIcon("i-unlock","icon-sm")+'<span>'+fa(30)+' دقیقه</span>';
    var b3=btn("۶۰ دقیقه","vu_60",g,"btn-tonal");b3.innerHTML=svgIcon("i-unlock","icon-sm")+'<span>'+fa(60)+' دقیقه</span>';
    sb.appendChild(g);

    g=el("div","grid");
    var bl=btn("قفل فوری صندوق","vl",g,"btn-danger-tonal");
    bl.innerHTML=svgIcon("i-lock","icon-sm")+'<span>قفل فوری صندوق</span>';
    bl.style.gridColumn="1/-1";
    sb.appendChild(g);

    sb.appendChild(el("div","lab","دسترسی‌ها"));
    g=el("div","grid");
    var bsu=btn("درخواست sudo","su",g,"btn-tonal");bsu.innerHTML=svgIcon("i-key","icon-sm")+'<span>درخواست sudo</span>';
    var bpn=btn("تنظیم PIN","pn",g,"btn-tonal");bpn.innerHTML=svgIcon("i-hash","icon-sm")+'<span>تنظیم PIN</span>';
    sb.appendChild(g);
  }

  // TAB 4 Tools & Tmux
  var tb=$("toolbtn");
  if(tb){
    g=el("div","grid");
    var t1=btn("اجرای دستور","cm",g,"btn-tonal");t1.innerHTML=svgIcon("i-terminal","icon-sm")+'<span>اجرای دستور</span>';
    var t2=btn("رویدادهای تونل","ev",g,"btn-tonal");t2.innerHTML=svgIcon("i-activity","icon-sm")+'<span>رویدادهای تونل</span>';
    var t3=btn("درخواست sudo","su",g,"btn-tonal");t3.innerHTML=svgIcon("i-key","icon-sm")+'<span>درخواست sudo</span>';
    var t4=btn("تنظیم PIN","pn",g,"btn-tonal");t4.innerHTML=svgIcon("i-hash","icon-sm")+'<span>تنظیم PIN</span>';
    tb.appendChild(g);
  }

  var tm=$("tmux");
  if(tm){
    if(!d||!Array.isArray(d.tmux))empty(tm,"در دسترس نیست","i-layers");
    else if(!d.tmux.length)empty(tm,"هیچ جلسهٔ tmux بازی وجود ندارد","i-layers");
    else d.tmux.forEach(function(n){
      var r=el("div","row");
      r.appendChild(el("div","mono name ltr",n));
      var a=el("div","acts");
      var b=btn("بستن","tk_"+n,a,"btn-danger-tonal");
      b.innerHTML=svgIcon("i-trash","icon-sm")+'<span>بستن</span>';
      r.appendChild(a);
      tm.appendChild(r);
    });
  }
  if($("newtmux")){
    var nt=$("newtmux");nt.textContent="";
    var nb=btn("tmux جدید","tn",nt,"btn-tonal");
    nb.innerHTML=svgIcon("i-plus","icon-sm")+'<span>tmux جدید</span>';
    nb.style.width="100%";
  }
}

function updateTabIndicator(activeBtn){
  var ind=$("tab-indicator");if(!ind)return;
  if(!activeBtn)activeBtn=document.querySelector(".tab-btn.active");
  if(!activeBtn)return;
  var bar=activeBtn.parentElement;if(!bar)return;
  var barRect=bar.getBoundingClientRect(),btnRect=activeBtn.getBoundingClientRect();
  var left=btnRect.left-barRect.left;
  ind.style.width=btnRect.width+"px";
  ind.style.transform="translateX("+left+"px)";
}

function switchTab(id){
  var tabs=["tab-main","tab-servers","tab-vault","tab-tools","tab-agy"];
  if(tabs.indexOf(id)===-1)id="tab-main";
  var btns=document.querySelectorAll(".tab-btn"),matchedBtn=null;
  for(var i=0;i<btns.length;i++){
    var b=btns[i];var match=b.getAttribute("data-tab")===id;
    b.classList.toggle("active",match);b.setAttribute("aria-selected",match?"true":"false");
    if(match)matchedBtn=b;
  }
  var panes=document.querySelectorAll(".tab-pane");
  for(var j=0;j<panes.length;j++){
    var p=panes[j];var match=p.id===id;
    p.classList.toggle("active",match);p.hidden=!match;
  }
  if(matchedBtn)updateTabIndicator(matchedBtn);
  try{localStorage.setItem("mini_active_tab",id)}catch(e){}
}

document.querySelectorAll(".tab-btn").forEach(function(b){
  b.addEventListener("click",function(){
    var t=b.getAttribute("data-tab");if(t)switchTab(t);
  });
});

window.addEventListener("resize",function(){updateTabIndicator()});
window.addEventListener("scroll",function(){
  var h=$("app-header");if(h)h.classList.toggle("scrolled",window.scrollY>10);
},{passive:true});

try{
  var saved=localStorage.getItem("mini_active_tab");
  if(saved&&document.getElementById(saved))switchTab(saved);
  else switchTab("tab-main");
}catch(e){switchTab("tab-main")}
try{var mt=/[#&]tab=([a-z]+)/.exec(location.hash);if(mt&&document.getElementById("tab-"+mt[1])){switchTab("tab-"+mt[1]);if(mt[1]==="agy")setTimeout(function(){if(window.agyOpen)window.agyOpen()},0)}}catch(e){}

try{var m=/[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash);if(m)data=unb64url(m[1])}catch(e){data=null}
theme();render(data);
setTimeout(function(){updateTabIndicator()},60);

function refresh(){
  var b=$("refresh");b.disabled=true;b.classList.add("spinning");b.setAttribute("aria-busy","true");
  call("state",{}).then(function(r){
    shown(r);
    var n=r.state&&r.state.notes&&r.state.notes.length?r.state.notes.join("\n"):"";
    say(n);
  }).catch(fail).then(function(){
    b.disabled=false;
    b.classList.remove("spinning");
    b.setAttribute("aria-busy","false");
  });
}
$("refresh").addEventListener("click",refresh);
refresh();
</script>
<script>
(function(){
var TERR={"quota-429":"سهمیه","unavailable-503":"مشغول","auth-timeout":"ورود","interrupted":"قطع","stub":"جواب خالی"};
var accts=null,agyBusy=false;
function agyCall(b){return call("agy",b)}
function when(ts){return ts>0?ago(ts):"-"}
function leftH(ts){return fa(Math.max(1,Math.round((ts-Date.now()/1000)/3600)))+" ساعت"}

function loadAgy(){
  agyCall({op:"status"}).then(function(r){accts=r&&r.accounts?r.accounts:null;drawAgy()}).catch(fail);
}
function setAccts(r){if(r&&r.accounts){accts=r.accounts;drawAgy()}}
function agyRun(label,body,done){
  if(agyBusy){say("یک کار agy در حال اجراست؛ صبر کنید.",true);return}
  agyBusy=true;say(label,false);
  agyCall(body).then(function(r){agyBusy=false;setAccts(r);if(done)done(r);else say(r.text||(r.ok?"انجام شد.":"انجام نشد."),!r.ok)}).catch(function(e){agyBusy=false;fail(e)});
}

function drawAgy(){
  var box=$("agylist");if(!box)return;box.textContent="";
  if(!accts||!accts.length){empty(box,"وضعیت حساب‌ها هنوز نیامده؛ «تازه‌سازی» را بزنید.","i-activity");return}
  accts.forEach(function(a){
    var c=el("div","agy-card"),h=el("div","agy-head");
    h.appendChild(el("span","agy-dot "+a.light));h.appendChild(el("span","agy-name",a.acct));
    h.appendChild(el("span","chip"+(a.light==="red"?" bad":a.light==="green"?" ok":""),a.why||""));
    c.appendChild(h);
    c.appendChild(el("div","agy-line","آخرین موفق: "+when(a.last_ok)+" · میانهٔ زمان: "+(a.median?fa(a.median)+" ثانیه":"-")+" · تعداد: "+fa(a.n)));
    if(a.last_err)c.appendChild(el("div","agy-line","آخرین خطا: "+(TERR[a.last_err.cls]||a.last_err.cls)+" ("+when(a.last_err.t)+")"));
    if(a.cool_until)c.appendChild(el("div","agy-line","کنار گذاشته شده تا "+leftH(a.cool_until)+" دیگر"));
    if(a.rest_until)c.appendChild(el("div","agy-line","استراحت دستی: "+leftH(a.rest_until)+" دیگر"));
    var ac=el("div","acts"),t=el("button","","تست"),l=el("button","sec","ورود دوباره"),r=el("button","sec",a.rest_until?"پایان استراحت":"استراحت");
    [t,l,r].forEach(function(b){b.type="button";ac.appendChild(b)});
    t.addEventListener("click",function(){agyRun("در حال تست "+a.acct+" (تا ۹۰ ثانیه)...",{op:"test",acct:a.acct})});
    l.addEventListener("click",function(){agyRun("شروع ورود "+a.acct+" (چند ثانیه)...",{op:"relogin",acct:a.acct},function(x){showLogin(a.acct,x)})});
    r.addEventListener("click",function(){
      if(a.rest_until)return agyRun("...",{op:"rest",acct:a.acct,on:false});
      dlg("چند ساعت استراحت کند؟ (در این مدت فقط اگر بقیه شکست بخورند استفاده می‌شود.)",[],function(h){agyRun("...",{op:"rest",acct:a.acct,on:true,hours:parseInt(h,10)})},"",[["6","۶ ساعت"],["24","۲۴ ساعت"],["72","۷۲ ساعت"]]);
    });
    c.appendChild(ac);box.appendChild(c);
  });
}

function showLogin(acct,r){
  var b=$("agylogin");b.textContent="";
  var hostOk=false;try{var u=new URL(r.url);hostOk=u.protocol==="https:"&&u.hostname==="accounts.google.com"}catch(e){}
  if(!r.ok||!hostOk){b.hidden=false;b.appendChild(el("div","dm",r.text||"ورود ممکن نشد."));return}
  b.hidden=false;
  b.appendChild(el("div","dm","ورود "+acct+": "+r.text));
  var l=el("a","agylink","باز کردن لینک ورود گوگل");l.href=r.url;l.target="_blank";l.rel="noopener noreferrer";
  l.addEventListener("click",function(e){var w=window.Telegram&&window.Telegram.WebApp;if(w&&w.openLink){e.preventDefault();try{w.openLink(r.url)}catch(x){window.open(r.url,"_blank")}}});
  b.appendChild(l);
  var i=document.createElement("input");i.type="text";i.autocomplete="off";i.setAttribute("autocapitalize","off");i.placeholder="کدی که گوگل می‌دهد";b.appendChild(i);
  var ac=el("div","acts"),s=el("button","","ارسال کد"),x=el("button","sec","بستن");s.type=x.type="button";ac.appendChild(s);ac.appendChild(x);b.appendChild(ac);
  s.addEventListener("click",function(){
    var v=i.value.trim();if(!v)return;
    agyRun("کد فرستاده شد؛ تست انجام می‌شود (تا یک دقیقه)...",{op:"code",acct:acct,code:v},function(y){b.hidden=true;b.textContent="";say(y.text,!y.ok)});
  });
  x.addEventListener("click",function(){b.hidden=true;b.textContent=""});
}

/* ---------------- terminal ---------------- */
var sid=null,target=null,timer=null,polling=false;
function termCall(b){b.sid=sid;return call("term",b)}
function stopTerm(){sid=null;if(timer){clearInterval(timer);timer=null}drawTerm()}
function openTerm(blob){
  var body={op:"open"};if(blob)body.enc=blob;
  call("term",body).then(function(r){
    if(r.sid){sid=r.sid;target=(r.targets&&r.targets[0]||{}).v||"agy1";drawTerm(r.targets);startPoll();return}
    if(r.need==="pin"){
      dlg(r.text,[{p:"PIN",n:1}],function(v){
        enc({n:r.nonce,t:Math.floor(Date.now()/1000),pin:v[0]}).then(function(d){openTerm(d)}).catch(function(){say("رمزنگاری در این مرورگر ممکن نیست.",true)});
      },"ارسال");return;
    }
    say(r.text||"باز نشد.",true);
  }).catch(fail);
}
var frozen=false;
function selIn(n){try{var g=window.getSelection();return !!(n&&g&&!g.isCollapsed&&g.rangeCount&&n.contains(g.getRangeAt(0).commonAncestorContainer))}catch(e){return false}}
function copyText(t){
  function old(){var a=document.createElement("textarea");a.value=t;a.setAttribute("readonly","");a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(a);say(ok?"کپی شد.":"کپی نشد؛ متن را نگه دارید و انتخاب کنید.",!ok)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){say("کپی شد.")},old);else old();
}
function startPoll(){
  if(timer)clearInterval(timer);
  timer=setInterval(function(){
    if(!sid||polling||frozen||document.hidden||$("tab-agy").hidden||selIn($("tscreen")))return;
    polling=true;
    termCall({op:"view",target:target}).then(function(r){
      polling=false;var s=$("tscreen");if(!s)return;
      if(r.expired){say(r.text,true);stopTerm();return}
      if(r.ok){if(frozen||selIn(s)||s.textContent===r.screen)return;var stick=s.scrollTop+s.clientHeight>=s.scrollHeight-8;s.textContent=r.screen;if(stick)s.scrollTop=s.scrollHeight}
      else s.textContent=r.text||"";
    }).catch(function(e){polling=false;stopTerm();fail(e)});
  },1000);
}
function sendLine(inp){
  var v=inp.value;if(!v)return;
  termCall({op:"send",target:target,text:v}).then(function(r){if(r.ok)inp.value="";else say(r.text||"ارسال نشد.",true);if(r.expired)stopTerm()}).catch(fail);
}
function drawTerm(targets){
  var box=$("term");if(!box)return;
  if(!targets&&box.dataset.t){try{targets=JSON.parse(box.dataset.t)}catch(e){}}
  box.textContent="";
  if(!sid){
    box.dataset.t="";
    box.appendChild(el("div","agy-line","ترمینال بدون sudo؛ ورود با PIN، بعد از ۱۵ دقیقه بی‌کاری بسته می‌شود و هر خط ثبت می‌شود."));
    var o=el("button","","باز کردن ترمینال (PIN)");o.type="button";o.style.marginTop="10px";o.style.width="100%";
    o.addEventListener("click",function(){openTerm()});box.appendChild(o);return;
  }
  box.dataset.t=JSON.stringify(targets||[]);
  var s=sel((targets||[]).map(function(t){return[t.v,t.t]}));s.value=target;s.style.width="100%";
  s.addEventListener("change",function(){target=s.value;var p=$("tscreen");if(p)p.textContent=""});box.appendChild(s);
  var p=el("pre","termscreen");p.id="tscreen";p.dir="ltr";p.setAttribute("aria-label","صفحهٔ ترمینال");box.appendChild(p);
  var cr=el("div","termkeys"),cb=el("button","sec","کپی همه"),fb=el("button","sec",frozen?"ادامه":"مکث");cb.type="button";fb.type="button";
  cb.addEventListener("click",function(){var g="";try{g=selIn(p)?String(window.getSelection()):""}catch(e){}copyText(g||p.textContent||"")});
  fb.addEventListener("click",function(){frozen=!frozen;fb.textContent=frozen?"ادامه":"مکث";p.classList.toggle("frozen",frozen)});
  p.classList.toggle("frozen",frozen);cr.appendChild(cb);cr.appendChild(fb);box.appendChild(cr);
  var row=el("div","termrow"),i=document.createElement("input");i.type="text";i.className="term-in";i.dir="ltr";i.autocomplete="off";i.setAttribute("autocapitalize","off");i.setAttribute("autocorrect","off");i.setAttribute("enterkeyhint","send");i.placeholder="یک خط بنویسید";
  var b=el("button","","ارسال");b.type="button";row.appendChild(i);row.appendChild(b);box.appendChild(row);
  b.addEventListener("click",function(){sendLine(i)});
  i.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();sendLine(i)}});
  var ks=el("div","termkeys");
  [["Enter","Enter"],["Ctrl+C","Ctrl+C"],["Tab","Tab"],["↑","Up"],["↓","Down"],["←","Left"],["→","Right"],["Esc","Esc"]].forEach(function(k){
    var kb=el("button","sec",k[0]);kb.type="button";kb.addEventListener("click",function(){
      termCall({op:"key",target:target,key:k[1]}).then(function(r){if(!r.ok)say(r.text||"ارسال نشد.",true);if(r.expired)stopTerm()}).catch(fail)});
    ks.appendChild(kb);
  });
  box.appendChild(ks);
  var c=el("button","del","بستن ترمینال");c.type="button";c.style.marginTop="10px";c.style.width="100%";
  c.addEventListener("click",function(){termCall({op:"close"}).catch(function(){});stopTerm()});box.appendChild(c);
}

drawTerm();drawAgy();
var tb=$("tab-btn-agy");
if(tb)tb.addEventListener("click",loadAgy);
var _r=$("refresh");if(_r)_r.addEventListener("click",function(){if(!$("tab-agy").hidden)loadAgy()});
window.agyOpen=loadAgy;
if(!$("tab-agy").hidden)loadAgy();
})();
</script>
</body>
