<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برنامه کرم</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--sec:#f1f2f5;--card:#fff;--fg:#111;--mut:#6b7078;--bd:#e2e4e9;--ac:#2a7ae4;--acf:#fff;--wr:#d33;--ok:#15733e;--yl:#c98a00}
@media(prefers-color-scheme:dark){:root{--bg:#17181a;--sec:#0f1011;--card:#232427;--fg:#eee;--mut:#9aa0a8;--bd:#34363a;--ac:#2f7fd8;--acf:#fff;--wr:#ff7b7b;--ok:#4cd080;--yl:#e8b53a}}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--tg-theme-secondary-bg-color,var(--sec));color:var(--tg-theme-text-color,var(--fg));font:15px/1.6 Vazirmatn,"Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto}
h1{font-size:20px;line-height:1.4;margin:0}
h2{font-size:14px;font-weight:600;margin:0 0 10px;color:var(--tg-theme-hint-color,var(--mut))}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.age{color:var(--tg-theme-hint-color,var(--mut));font-size:13px;margin:0 0 12px}
.age.old{color:var(--tg-theme-destructive-text-color,var(--wr));font-weight:600}
.card{background:var(--tg-theme-section-bg-color,var(--card));border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 0 0 1px var(--bd) inset}
.row{padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.mut{color:var(--tg-theme-hint-color,var(--mut));font-size:13px}
.ltr{direction:ltr;text-align:right;unicode-bidi:isolate;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;text-align:right;font-size:13px;overflow-wrap:anywhere}
.name{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;line-height:1.5;padding:2px 9px;border-radius:99px;background:var(--tg-theme-secondary-bg-color,var(--sec));color:var(--tg-theme-hint-color,var(--mut));white-space:nowrap}
.chip.bad{color:var(--tg-theme-destructive-text-color,var(--wr));box-shadow:0 0 0 1px currentColor inset;background:none}
.chip.ok{color:var(--ok)}
.warn{color:var(--tg-theme-destructive-text-color,var(--wr));font-size:13px;margin-top:6px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid:last-child{margin-bottom:0}
.lab{font-size:12px;font-weight:600;color:var(--tg-theme-hint-color,var(--mut));margin:12px 0 6px}
.lab:first-of-type{margin-top:0}
button,select{min-height:44px;font:inherit;font-size:14px;border-radius:10px;padding:8px 12px;touch-action:manipulation}
button{border:0;background:var(--tg-theme-button-color,var(--ac));color:var(--tg-theme-button-text-color,var(--acf));cursor:pointer;transition:transform .12s ease-out,opacity .12s}
button:active{transform:scale(.97)}
button.sec{background:none;color:var(--tg-theme-button-color,var(--ac));box-shadow:0 0 0 1.5px currentColor inset}
button.del{background:none;color:var(--tg-theme-destructive-text-color,var(--wr));box-shadow:0 0 0 1.5px currentColor inset}
button:focus-visible,select:focus-visible{outline:2px solid var(--tg-theme-button-color,var(--ac));outline-offset:2px}
button:disabled{opacity:.55;box-shadow:none;background:var(--bd);color:var(--mut);transform:none}
.acts button{flex:1 1 auto;min-width:88px}
select{padding-inline:6px;border:1px solid var(--bd);background:var(--tg-theme-bg-color,var(--bg));color:inherit;flex:1 1 100px;min-width:0;text-overflow:ellipsis}
#refresh{width:auto;min-width:130px}
.fm{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.st{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
</head>
<body>
<main>
<div class="top"><h1>برنامه کرم</h1><button id="refresh" type="button" class="sec">🔄 تازه‌سازی</button></div>
<div id="age" class="age" aria-live="polite"></div>
<div class="card"><h2>🖥 سرورها</h2><div id="servers"></div></div>
<div class="card"><h2>⚙️ جلسه‌ها</h2><div id="sessions"></div><div class="fm acts" id="newsess"></div></div>
<div class="card"><h2>🖥 tmux</h2><div id="tmux"></div><div class="fm" id="newtmux"></div></div>
<div class="card"><h2>🔐 sudo و صندوق رمز</h2><div class="st" id="secst"></div><div id="secbtn"></div></div>
</main>
<script>
var data=null;
function $(i){return document.getElementById(i)}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=String(txt);return e}
function fa(n){return String(n).replace(/\d/g,function(d){return"۰۱۲۳۴۵۶۷۸۹"[d]})}
function unb64url(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";
  var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  return JSON.parse(new TextDecoder("utf-8").decode(u));
}
function post(type,obj){
  var ev=JSON.stringify({eventType:type,eventData:obj});
  if(window.TelegramWebviewProxy&&window.TelegramWebviewProxy.postEvent)window.TelegramWebviewProxy.postEvent(type,JSON.stringify(obj));
  else if(window.external&&window.external.notify)window.external.notify(ev);
  else if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.performAction)window.webkit.messageHandlers.performAction.postMessage(ev);
  else{try{window.parent.postMessage(ev,"https://web.telegram.org")}catch(e){throw new Error("post failed")}}
}
var OKP=/^[A-Za-z0-9_-]{1,64}$/;
function theme(){
  try{var m=/[#&]tgWebAppThemeParams=([^&]+)/.exec(location.hash);if(!m)return;
    var t=JSON.parse(decodeURIComponent(m[1]));
    for(var k in t)if(/^[a-z_]+$/.test(k)&&/^#[0-9a-fA-F]{3,8}$/.test(t[k]))document.documentElement.style.setProperty("--tg-theme-"+k.replace(/_/g,"-"),t[k]);
  }catch(e){}
}
function act(p){
  if(!data||!data.bot||!OKP.test(p)){$("age").textContent="عملیات ممکن نیست.";return}
  try{post("web_app_open_tg_link",{path_full:"/"+data.bot+"?start="+p});setTimeout(function(){try{post("web_app_close",{})}catch(e){}},300)}
  catch(e){$("age").textContent="این کار فقط داخل تلگرام ممکن است."}
}
function btn(txt,p,box,cls){var b=el("button",cls||"",txt);b.type="button";b.addEventListener("click",function(){act(p)});box.appendChild(b);return b}
function sel(opts){var s=document.createElement("select");opts.forEach(function(o){var e=el("option","",o[1]);e.value=o[0];s.appendChild(e)});return s}
function empty(box,txt){box.appendChild(el("div","mut",txt))}
function chip(box,txt,cls){box.appendChild(el("span","chip "+(cls||""),txt))}
function ago(ts){return ts>0?fa(Math.max(0,Math.floor((Date.now()/1000-ts)/60)))+" دقیقه پیش":"نامشخص"}
function render(d){
  var age=$("age"),ref=null;
  if(d&&Array.isArray(d.servers)){d.servers.forEach(function(s){if(s&&s.ts>0&&(ref===null||s.ts<ref))ref=s.ts})}
  if(ref===null&&d&&typeof d.t==="number")ref=d.t;
  var mins=ref!==null?Math.floor((Date.now()/1000-ref)/60):null;
  if(mins===null){age.textContent="داده‌ای نیست";age.className="age old"}
  else{age.textContent="سن داده: "+fa(Math.max(mins,0))+" دقیقه"+(mins>10?" - قدیمی است، تازه‌سازی را بزنید":"");age.className="age"+(mins>10?" old":"")}
  var sv=$("servers");
  if(!d||!Array.isArray(d.servers))empty(sv,"در دسترس نیست");
  else if(!d.servers.length)empty(sv,"سروری ثبت نشده");
  else d.servers.forEach(function(s){
    var r=el("div","row"),ic=s.s==="g"?"🟢":s.s==="y"?"🟡":"🔴";
    r.appendChild(el("div","ltr name",ic+" "+s.h));
    var c=el("div","chips");
    chip(c,"قفل "+fa(s.lock),Number(s.lock)>0?"bad":"");
    chip(c,"خروجی "+fa(s.exit));
    chip(c,"دیسک "+fa(s.disk)+"٪",s.disk>=90?"bad":"");
    chip(c,"رم آزاد "+fa(s.mem)+"٪",s.mem<=10?"bad":"");
    chip(c,ago(s.ts));
    r.appendChild(c);
    if(Array.isArray(s.down)&&s.down.length)r.appendChild(el("div","warn mono","⚠ "+s.down.join(" ")));
    sv.appendChild(r);
  });
  var se=$("sessions");
  if(!d||!Array.isArray(d.sessions))empty(se,"در دسترس نیست");
  else if(!d.sessions.length)empty(se,"هنوز جلسه‌ای ساخته نشده");
  else d.sessions.forEach(function(s){
    var r=el("div","row");
    r.appendChild(el("div","ltr name",(s.a?"▶ ":"")+s.n));
    r.appendChild(el("div","mut",[s.k,s.p,s.m].filter(Boolean).join(" · ")));
    var a=el("div","acts");
    btn("▶ استفاده","u_"+s.n,a);btn("⏹ توقف","x",a,"sec");btn("🗑 حذف","k_"+s.n,a,"del");
    r.appendChild(a);se.appendChild(r);
  });
  var tm=$("tmux");
  if(!d||!Array.isArray(d.tmux))empty(tm,"در دسترس نیست");
  else if(!d.tmux.length)empty(tm,"هیچ جلسهٔ tmux بازی نیست");
  else d.tmux.forEach(function(n){var r=el("div","row");r.appendChild(el("div","mono name",n));var a=el("div","acts");btn("🗑 بستن","tk_"+n,a,"del");r.appendChild(a);tm.appendChild(r)});
  btn("➕ tmux جدید","tn",$("newtmux"),"sec").style.width="100%";
  var ns=$("newsess");
  if(d&&Array.isArray(d.proj)&&d.proj.length){
    var kd=sel([["c","Claude"],["g","Gemini"]]),pj=sel(d.proj.map(function(p){return[p,p]})),md=sel([["o","opus"],["s","sonnet"],["h","haiku"]]);
    kd.addEventListener("change",function(){md.style.display=kd.value==="c"?"":"none"});
    ns.appendChild(kd);ns.appendChild(pj);ns.appendChild(md);
    var go=el("button","","➕ جلسهٔ جدید");go.type="button";go.style.width="100%";
    go.addEventListener("click",function(){act(kd.value==="c"?"nc_"+md.value+"_"+pj.value:"ng_"+pj.value)});
    ns.appendChild(go);
  }else ns.style.display="none";
  var st=$("secst"),now=Date.now()/1000,v=d&&d.vault,su=d&&d.sudo;
  chip(st,!Array.isArray(v)?"صندوق: نامشخص":v[0]==="u"?"🔓 صندوق باز، "+fa(Math.max(0,Math.floor(v[1]-now/60)))+" دقیقه مانده":v[0]==="n"?"صندوق ساخته نشده":"🔒 صندوق بسته",Array.isArray(v)&&v[0]==="u"?"ok":"");
  chip(st,!Array.isArray(su)?"sudo: نامشخص":su.length?"sudo روشن: "+su.map(function(x){return x.s+" تا "+fa(Math.max(0,Math.floor((x.e-now)/60)))+" دقیقه"}).join("، "):"sudo خاموش",Array.isArray(su)&&su.length?"ok":"");
  var sb=$("secbtn"),g;
  sb.appendChild(el("div","lab","صندوق رمز"));
  g=el("div","grid g3");btn("🔓 "+fa(15)+" دقیقه","vu_15",g);btn("🔓 "+fa(30)+" دقیقه","vu_30",g);btn("🔓 "+fa(60)+" دقیقه","vu_60",g);sb.appendChild(g);
  g=el("div","grid");btn("🔒 قفل صندوق","vl",g,"del").style.gridColumn="1/-1";sb.appendChild(g);
  sb.appendChild(el("div","lab","ابزارها"));
  g=el("div","grid");btn("🔑 درخواست sudo","su",g,"sec");btn("⌨️ اجرای دستور","cm",g,"sec");btn("🔢 PIN","pn",g,"sec");btn("🛰 رویدادهای تونل","ev",g,"sec");sb.appendChild(g);
}
try{var m=/[#&]d=([A-Za-z0-9_-]+)/.exec(location.hash);if(m)data=unb64url(m[1])}catch(e){data=null}
theme();render(data);
$("refresh").addEventListener("click",function(){
  var b=this;b.disabled=true;b.textContent="در حال دریافت…";
  function back(){b.disabled=false;b.textContent="🔄 تازه‌سازی"}
  try{
    if(data&&data.bot){post("web_app_open_tg_link",{path_full:"/"+data.bot+"?start=app_refresh"});setTimeout(function(){try{post("web_app_close",{})}catch(e){}back()},300)}
    else{$("age").textContent="برنامه را ببندید و از دکمهٔ App دوباره باز کنید.";post("web_app_data_send",{data:JSON.stringify({m:"app_refresh"})});setTimeout(back,1500)}
  }catch(e){$("age").textContent="تازه‌سازی فقط داخل تلگرام کار می‌کند.";back()}
});
</script>
</body>
</html>
