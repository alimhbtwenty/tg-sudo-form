    var hd=h("div","head");hd.appendChild(h("h2",null,"L2TP؛ اتصال‌های زنده"));m.appendChild(hd);
    var N=d.now||[];
    if(!N.length)m.appendChild(stateBox("empty","الان کسی به L2TP وصل نیست."));
    else{
      var c=h("div","card");
      N.forEach(function(u){
        var r=h("div","row"),g=h("div","grow"),n=h("div","name");n.appendChild(ltr(u.user||"—"));g.appendChild(n);
        var s=h("div","sub");s.appendChild(ltr(u.ip||"—"));
        if(u.from_ip){s.appendChild(h("span",null,"  ·  از "));s.appendChild(ltr(u.from_ip))}
        g.appendChild(s);
        g.appendChild(h("div","sub",(u.since?"از "+when(u.since)+"  ·  ":"")+"دریافت "+bytes(u.rx)+"  ·  ارسال "+bytes(u.tx)));
        r.appendChild(g);r.appendChild(h("span","pillx c","متصل"));c.appendChild(r);
      });
      m.appendChild(c);
    }
    var h2=h("div","head");h2.appendChild(h("h2",null,"تاریخچهٔ اتصال و قطع"));m.appendChild(h2);
    var H=d.history||[];
    if(!H.length){m.appendChild(stateBox("empty","هنوز اتصالی ثبت نشده. بعد از اولین اتصال یا قطع، اینجا نمایش داده می‌شود."));return}
    var c2=h("div","card");
    H.forEach(function(e){
      var r=h("div","row"),g=h("div","grow"),n=h("div","name");n.appendChild(ltr(e.user||"—"));g.appendChild(n);
      var s=h("div","sub",when(e.time));
      if(e.from_ip){s.appendChild(h("span",null,"  ·  از "));s.appendChild(ltr(e.from_ip))}
      g.appendChild(s);
      if(e.event==="disconnect"&&(e.duration!=null||e.rx!=null))g.appendChild(h("div","sub","مدت "+dur(e.duration)+"  ·  دریافت "+bytes(e.rx)+"  ·  ارسال "+bytes(e.tx)));
      r.appendChild(g);r.appendChild(h("span","pillx "+(e.event==="connect"?"c":"d"),e.event==="connect"?"اتصال":"قطع"));c2.appendChild(r);
    });
    m.appendChild(c2);
  },
  links:function(m,d){
    var hd=h("div","head");hd.appendChild(h("h2",null,"لینک‌ها"));
    var addb=h("button","btn pri sm","لینک جدید");addb.type="button";addb.onclick=newLink;hd.appendChild(addb);m.appendChild(hd);
    var L=d.links||[];
    if(!L.length){m.appendChild(stateBox("empty","هنوز لینکی ثبت نشده. با دکمهٔ «لینک جدید» اولین لینک را اضافه کنید."));return}
    if(d.total>L.length)m.appendChild(h("p","note","برترین "+fa(L.length)+" لینک از "+fa(d.total)+" لینک نمایش داده می‌شود."));
    var c=h("div","card");
    L.forEach(function(l){
      var r=h("div","row"),g=h("div","grow"),n=h("div","name");n.appendChild(ltr(l.name));g.appendChild(n);
      var s=h("div","sub");
      s.appendChild(ltr(l.country||"—"));
      s.appendChild(h("span",null,"  ·  امتیاز "+(l.score==null?"—":fa(Math.round(l.score)))));
      if(l.ping!=null)s.appendChild(h("span",null,"  ·  "+fa(Math.round(l.ping))+" میلی‌ثانیه"));
      g.appendChild(s);r.appendChild(g);
      if(l.active)r.appendChild(h("span","tag act","در حال استفاده"));
      else if(!l.enabled)r.appendChild(h("span","tag off","غیرفعال"));
      else{r.appendChild(h("span","tag on","آماده"));var b=h("button","btn sm","استفاده از این");b.type="button";b.onclick=function(){doSwitch(l)};r.appendChild(b)}
      c.appendChild(r);
    });
    m.appendChild(c);
  },
  wg:function(m,d){
    var hd=h("div","head");hd.appendChild(h("h2",null,"کاربران WireGuard"));
    var add=h("button","btn pri","کاربر جدید");add.type="button";add.onclick=newClient;hd.appendChild(add);m.appendChild(hd);
    var L=d.clients||[];
    if(!L.length){m.appendChild(stateBox("empty","هنوز کاربری ساخته نشده. با دکمهٔ «کاربر جدید» اولین کاربر را بسازید."));return}
    var c=h("div","card");
    L.forEach(function(u){
      var r=h("div","row"),g=h("div","grow"),n=h("div","name");n.appendChild(ltr(u.name));g.appendChild(n);
      var s=h("div","sub");s.appendChild(ltr(u.ip||"—"));
      s.appendChild(h("span",null,"  ·  دریافت "+bytes(u.rx)+"  ·  ارسال "+bytes(u.tx)));
      g.appendChild(s);r.appendChild(g);
      r.appendChild(h("span","tag "+(u.online?"on":"off"),u.online?"آنلاین":"آفلاین"));
      var b=h("button","btn sm","QR");b.type="button";b.setAttribute("aria-label","نمایش QR برای "+u.name);b.onclick=function(){showQr(u.name,u.ip)};r.appendChild(b);
      c.appendChild(r);
    });
    m.appendChild(c);
  },
  usage:function(m,d){
    var hd=h("div","head");hd.appendChild(h("h2",null,"مصرف هر لینک"));m.appendChild(hd);
    var R=d.rows||[];
    if(!R.length){m.appendChild(stateBox("empty","هنوز مصرفی ثبت نشده. بعد از چند دقیقه ترافیک، دوباره تازه‌سازی کنید."));return}
    var max=Math.max.apply(null,R.map(function(r){return r.up+r.down}))||1,c=h("div","card");
    R.forEach(function(r){
      var row=h("div","row"),g=h("div","grow"),n=h("div","name");n.appendChild(ltr(r.name));
      if(r.active){n.appendChild(h("span","tag act","  فعال"))}
      g.appendChild(n);
      g.appendChild(h("div","sub","کل "+bytes(r.up+r.down)+"  ·  امروز "+bytes(r.today)+"  ·  دریافت "+bytes(r.down)+"  ·  ارسال "+bytes(r.up)));
      var bar=h("div","bar"),b=h("b");b.style.width=Math.max(2,Math.round((r.up+r.down)/max*100))+"%";bar.appendChild(b);g.appendChild(bar);
      row.appendChild(g);c.appendChild(row);
    });
    m.appendChild(c);
  }
};
/* ---------- actions ---------- */
function doSwitch(l){
  withPin({op:"switch",id:l.id},"تعویض لینک","به «"+l.name+"» تعویض شود؟ PIN را وارد کنید.",function(r){
    if(!r.ok){toast(r.text||"تعویض شروع نشد.","bad");return}
    var bz=busyBox("در حال تعویض…"),n=0;
    (function poll(){
      n++;
      call({op:"job",id:r.job}).then(function(j){
        var s=j.ok&&j.job&&j.job.state;
        if(s==="running"&&n<60)return setTimeout(poll,1500);
        bz.close();
        if(s==="ok")toast("لینک فعال شد: "+l.name,"ok");
        else toast(s==="running"?"تعویض طول کشید؛ بعداً وضعیت را ببینید.":((j.job&&j.job.err)||j.text||"تعویض انجام نشد."),"bad");
        D.status={};D.links={};load("links");
      }).catch(function(e){bz.close();toast(errText(e),"bad")});
    })();
  });
}
var LINK_RX=/^(vless|vmess|trojan|ss|hy2|tuic):\/\/\S+$/i;
function newLink(){
  dlg({title:"لینک جدید",msg:"لینک v2ray را اینجا بچسبانید (vless، vmess، trojan، ss، hy2 یا tuic). نام اختیاری است.",
    fields:[{id:"link",label:"لینک",area:1,ph:"vless://…"},{id:"name",label:"نام (اختیاری)",ph:"de-frankfurt-02"}],ok:"ادامه",onOk:function(v,api){
      if(!LINK_RX.test(v.link)||v.link.length>4096){api.err("لینک نامعتبر است؛ باید با vless:// ، vmess:// ، trojan:// ، ss:// ، hy2:// یا tuic:// شروع شود و فاصله نداشته باشد.");return}
      if(v.name.length>60){api.err("نام حداکثر ۶۰ نویسه.");return}
      api.close();
      var b={op:"link_add",link:v.link};if(v.name)b.name=v.name;
      withPin(b,"افزودن لینک","PIN را وارد کنید.",function(r){
        if(!r.ok){toast(r.text||"لینک اضافه نشد.","bad");return}
        toast("لینک اضافه شد؛ تا چند دقیقه امتیازش محاسبه می‌شود.","ok");
        D.links={};D.status={};if(tab==="links")load("links");
      });
    }});
}
function newClient(){
  dlg({title:"کاربر جدید WireGuard",msg:"یک نام انگلیسی برای دستگاه بنویسید (حرف، عدد، نقطه، خط تیره؛ تا ۳۲ نویسه).",
    fields:[{id:"name",label:"نام",ph:"phone-ali"}],ok:"ادامه",onOk:function(v,api){
      if(!WG_RX.test(v.name)){api.err("نام نامعتبر است؛ فقط حرف انگلیسی، عدد، نقطه، خط تیره و زیرخط.");return}
      api.close();
      withPin({op:"wg_add",name:v.name},"ساخت کاربر «"+v.name+"»","PIN را وارد کنید.",function(r){
        if(!r.ok){toast(r.text||"ساخته نشد.","bad");return}
        D.wg={};if(tab==="wg")load("wg");
        showQr(r.name,r.ip);
      });
    }});
}
function showQr(name,ip){
  var api=dlg({title:"QR کاربر «"+name+"»",msg:"در برنامهٔ WireGuard گزینهٔ «اسکن QR» را بزنید.",ok:false,cancel:"بستن"});
  var sh=api.sheet,box=h("div","state");box.appendChild(h("div","spin"));box.appendChild(h("p",null,"در حال ساخت QR…"));
  sh.insertBefore(box,sh.querySelector(".emsg"));
  call({op:"wg_qr",name:name}).then(function(r){
    clear(box);
    if(!r.ok){box.className="state err";box.appendChild(h("p",null,r.text||"QR ساخته نشد."));return}
    var im=h("img","qr");im.alt="QR کاربر "+name;im.src=r.qr;box.appendChild(im);
    var p=h("p",null,"آی‌پی داخلی: ");p.appendChild(ltr(ip||"—"));box.appendChild(p);
  }).catch(function(e){clear(box);box.className="state err";box.appendChild(h("p",null,errText(e)))});
}
/* ---------- start ---------- */
function go(t){
  tab=t;draw();
  var d=D[t]||{};if(signed()&&!d.data&&!d.loading)load(t);
}
(function init(){
  theme();
  try{var w=window.Telegram&&window.Telegram.WebApp;if(w){w.ready&&w.ready();w.expand&&w.expand();w.onEvent&&w.onEvent("themeChanged",theme)}}catch(e){}
  if(window.matchMedia){try{window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(!(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.colorScheme))theme()})}catch(e){}}
  TABS.forEach(function(t){
    var b=h("button");b.type="button";b.dataset.t=t.id;
    b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+t.i+'"/></svg>';
    b.appendChild(h("span",null,t.t));b.onclick=function(){go(t.id)};$("nav").appendChild(b);
  });
  $("swap").onclick=function(){location.href="app.html"+location.hash};
  $("hub").onclick=function(e){e.preventDefault();location.href="hub.html"+location.hash};
  $("refresh").onclick=function(){D[tab]={};load(tab)};
  timer=setInterval(function(){if(signed()&&tab==="status"&&!document.hidden&&!document.querySelector(".ov"))load("status",true)},30000);
  go("status");
})();
</script>
