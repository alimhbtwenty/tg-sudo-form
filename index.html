<style>

body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif}
form{max-width:420px;margin:0 auto}
label,.l{display:block;margin:14px 0 6px;color:var(--mut)}
input[type=password],input[type=text],textarea{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);direction:ltr;text-align:left}
textarea{min-height:120px;font-family:monospace}
.r label{display:inline-block;margin:0 0 0 18px;color:var(--fg)}
.h{display:none}
button{margin-top:22px;width:100%;padding:12px;font-size:17px;border:0;border-radius:8px;background:var(--ac);color:#fff}
button:disabled{opacity:.5}
#err{color:#d33;margin-top:12px;min-height:1.2em}
#out{margin-top:16px;white-space:pre-wrap;overflow-wrap:anywhere}
#out a{display:block;margin-top:14px;color:var(--ac)}

<body>
<form id="f" autocomplete="off">

<div id="g_cmd" class="h"><label for="cmd">دستور</label><textarea id="cmd" maxlength="1200" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea></div>
<div id="g_user"><label for="user">نام کاربری</label><input id="user" type="text" autocomplete="off" autocapitalize="off"></div>
<label for="pw">رمز</label><input id="pw" type="password" autocomplete="off">

function b64(buf){var s="",u=new Uint8Array(buf);for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function enc(obj){
  var s=window.crypto&&window.crypto.subtle;
  if(!s)return Promise.reject(new Error("no webcrypto"));
  var aes,iv=crypto.getRandomValues(new Uint8Array(12));
  return s.generateKey({name:"AES-GCM",length:256},true,["encrypt"]).then(function(k){
    aes=k;return s.encrypt({name:"AES-GCM",iv:iv},k,new TextEncoder().encode(JSON.stringify(obj)))
  }).then(function(c){
    return s.exportKey("raw",aes).then(function(raw){
      return s.importKey("spki",unb64(PUB),{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]).then(function(pk){
        return s.encrypt({name:"RSA-OAEP"},pk,raw)
      }).then(function(wk){return btoa(JSON.stringify({v:1,k:b64(wk),iv:b64(iv),c:b64(c)}))})
    })
  })
}
function post(data){
  var ev=JSON.stringify({eventType:"web_app_data_send",eventData:{data:data}});
  if(window.TelegramWebviewProxy&&window.TelegramWebviewProxy.postEvent)window.TelegramWebviewProxy.postEvent("web_app_data_send",JSON.stringify({data:data}));
  else if(window.external&&window.external.notify)window.external.notify(ev);
  else if(window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.performAction)window.webkit.messageHandlers.performAction.postMessage(ev);
  else{try{window.parent.postMessage(ev,"https://web.telegram.org")}catch(e){throw new Error("post failed")}}
}
function $(i){return document.getElementById(i)}
var API=new URLSearchParams(location.search).get("api")==="1";
function initd(){var m=/[#&]tgWebAppData=([^&]*)/.exec(location.hash);try{return m?decodeURIComponent(m[1]):""}catch(e){return ""}}
function sendApi(d){
  return fetch("https://91.220.113.145/wormapp/sudo",{method:"POST",headers:{"Authorization":"tma "+initd(),"Content-Type":"application/json"},body:JSON.stringify({data:d})}).then(function(r){
    if(r.status===403)throw new Error("auth");
    return r.json();
  });
}
function apiDone(r){
  if(r.need==="form"&&r.url){$("out").textContent=r.text||"";var a=document.createElement("a");a.href=r.url+location.hash;a.textContent="ادامه: تأیید دستور";$("out").appendChild(a);return}
  $("f").style.display="none";$("out").textContent=r.text||(r.ok?"انجام شد.":"انجام نشد.");
  var b=document.createElement("a");b.href="app.html"+location.hash;b.textContent="بازگشت به برنامه";$("out").appendChild(b);
}
var err=$("err"),q=new URLSearchParams(location.search),mode=q.get("m")==="cmd"?"cmd":q.get("m")==="ok"?"ok":"sudo";
var H=(q.get("h")||"");if(!/^[0-9a-f]{8}$/.test(H))H="";
function show(id,on){$(id).className=on?"":"h"}
show("g_act",mode==="sudo");show("g_cmd",mode==="cmd");show("g_pin",mode!=="ok");show("g_srv",mode!=="ok");show("g_user",mode!=="ok");
if(mode==="ok"){show("okbox",true);$("code").textContent=H}
if(!(window.crypto&&window.crypto.subtle))err.textContent="مرورگر WebCrypto ندارد.";
$("f").addEventListener("submit",function(e){
  e.preventDefault();err.textContent="";
  var f=e.target,btn=$("go"),t=Math.floor(Date.now()/1000),o,n=q.get("n")||"",pw=$("pw").value;
  if(mode==="ok"){
    if(!n||!pw||!H){err.textContent="همهٔ فیلدها لازم است.";return}
    o={k:"ok",n:n,pw:pw,t:t,h:H};
  }else{
    o={n:n,pin:$("pin").value,srv:f.srv.value,act:f.act.value,user:$("user").value,pw:pw,t:t};
    if(mode==="cmd"){o.k="cmd";o.cmd=$("cmd").value;delete o.act;if(!o.cmd||o.cmd.length>1200){err.textContent="دستور خالی یا بیش از ۱۲۰۰ نویسه است.";return}}
    if(!o.n||!o.pin||!o.user||!o.pw){err.textContent="همهٔ فیلدها لازم است.";return}
  }
  btn.disabled=true;
  enc(o).then(function(d){
    if(d.length>3800)throw new Error("too big");
    $("pin").value="";$("pw").value="";$("user").value="";$("cmd").value="";
    if(!API){post(d);return}
    return sendApi(d).then(apiDone).catch(function(x){err.textContent=x.message==="auth"?"دسترسی رد شد؛ از برنامه دوباره وارد شوید.":"سرور در دسترس نیست";btn.disabled=false});
  }).catch(function(x){err.textContent="خطا: "+x.message;btn.disabled=false});
});
